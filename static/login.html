<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mixer">
<meta name="theme-color" content="#15171b">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-180.png?v=2" sizes="180x180">
<link rel="icon" href="/static/icon-192.png?v=2">
<title>Mixer</title>
<style>
  :root {
    color-scheme: dark light;
    --chassis:#15171b; --strip:#1e2126; --edge:rgba(255,255,255,.05); --hi:rgba(255,255,255,.07);
    --groove:#08090b; --ink:#ebe9e4; --muted:#868b95; --key:#2a2e35; --key-hi:rgba(255,255,255,.10);
    --key-edge:rgba(0,0,0,.55); --brush:rgba(255,255,255,.018); --red:#ff4b3e; --green:#38d27a; --amber:#ffb62e;
    --drop:rgba(0,0,0,.65);
    --f-cond:"Avenir Next Condensed","DIN Condensed","Bahnschrift","Arial Narrow",system-ui,sans-serif;
    --f-num:"DIN Alternate","Avenir Next Condensed","Bahnschrift",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root { --chassis:#d6dae0; --strip:#eceef2; --edge:rgba(0,0,0,.07); --hi:rgba(255,255,255,.9); --groove:#aeb4be;
      --ink:#1a1d23; --muted:#656c78; --key:#e0e3e9; --key-hi:rgba(255,255,255,.95); --key-edge:rgba(40,50,70,.28);
      --brush:rgba(0,0,0,.02); --drop:rgba(40,50,70,.4); }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body { margin:0; background:var(--chassis); }
  body { color:var(--ink); font-family:var(--f-cond); font-weight:500; min-height:100vh; display:flex; flex-direction:column;
    background-image:repeating-linear-gradient(90deg,var(--brush) 0 1px,transparent 1px 3px); }
  header.plate { --ink:#ebe9e4; --muted:#9ba0aa; color:var(--ink); background:#15171b; display:flex; align-items:center; gap:11px;
    padding:calc(env(safe-area-inset-top) + 10px) 20px 12px; border-radius:0 0 22px 22px; box-shadow:inset 0 -1px 0 rgba(255,255,255,.07), 0 14px 24px -16px var(--drop); }
  .glyph { width:36px; height:36px; filter:drop-shadow(0 4px 8px rgba(0,0,0,.5)); }
  h1 { font-size:27px; font-weight:700; letter-spacing:-.01em; margin:0; line-height:1; }
  main { flex:1; width:100%; max-width:360px; margin:0 auto; padding:26px 18px max(26px,env(safe-area-inset-bottom)); display:flex; flex-direction:column; justify-content:center; }
  .lcd { height:74px; border-radius:14px; background:var(--groove); box-shadow:inset 0 2px 5px rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; gap:14px; }
  .lcd i { width:14px; height:14px; border-radius:50%; background:var(--ink); box-shadow:0 0 8px rgba(255,255,255,.25); animation:pop .12s ease-out; }
  .lcd.empty::after { content:"Introduce el PIN"; color:var(--muted); font-size:19px; font-weight:600; }
  @keyframes pop { from { transform:scale(.4); opacity:.3; } }
  .lcd.bad { animation:shake .38s; box-shadow:inset 0 2px 5px rgba(0,0,0,.5), 0 0 0 2px var(--red); }
  @keyframes shake { 20%,60% { transform:translateX(-8px); } 40%,80% { transform:translateX(8px); } }
  .msg { min-height:44px; margin:12px 4px 10px; text-align:center; font-size:16px; color:var(--muted); line-height:1.3; }
  .msg.err { color:var(--red); }
  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .k { height:66px; border:0; border-radius:14px; background:var(--key); color:var(--ink); font:600 28px var(--f-num); padding:0;
    box-shadow:inset 0 1px 0 var(--key-hi), 0 4px 0 var(--key-edge); transition:transform .06s, box-shadow .06s; }
  .k:active { transform:translateY(3px); box-shadow:inset 0 1px 0 var(--key-hi), 0 1px 0 var(--key-edge); }
  .k.fn { font:600 17px var(--f-cond); }
  .k.go { background:var(--ink); color:var(--chassis); }
  .k:disabled { opacity:.4; }
  .k svg { width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .k:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }
</style>
</head>
<body>
<header class="plate">
  <svg class="glyph" viewBox="0 0 40 40" aria-hidden="true">
    <defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#00c8ff"/></linearGradient></defs>
    <rect width="40" height="40" rx="10" fill="url(#gg)"/>
    <g fill="#fff"><rect x="9" y="9" width="3.4" height="22" rx="1.7" opacity=".35"/><rect x="18.3" y="9" width="3.4" height="22" rx="1.7" opacity=".35"/><rect x="27.6" y="9" width="3.4" height="22" rx="1.7" opacity=".35"/>
      <rect x="6.5" y="21" width="8.4" height="5" rx="1.6"/><rect x="15.8" y="13" width="8.4" height="5" rx="1.6"/><rect x="25.1" y="18" width="8.4" height="5" rx="1.6"/></g>
  </svg>
  <h1>Mixer</h1>
</header>

<main>
  <div class="lcd empty" id="lcd" role="status" aria-live="polite"></div>
  <div class="msg" id="msg">Solo te lo pedirá esta vez en este dispositivo.</div>
  <div class="pad" id="pad">
    <button class="k" data-d="1">1</button><button class="k" data-d="2">2</button><button class="k" data-d="3">3</button>
    <button class="k" data-d="4">4</button><button class="k" data-d="5">5</button><button class="k" data-d="6">6</button>
    <button class="k" data-d="7">7</button><button class="k" data-d="8">8</button><button class="k" data-d="9">9</button>
    <button class="k fn" id="del" aria-label="Borrar"><svg viewBox="0 0 24 24"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="m13 9.5 5 5M18 9.5l-5 5"/></svg></button>
    <button class="k" data-d="0">0</button>
    <button class="k fn go" id="go">Entrar</button>
  </div>
</main>

<script>
const lcd = document.getElementById('lcd'), msg = document.getElementById('msg'), go = document.getElementById('go');
let pin = '', busy = false, lockT = null;
const MAX = 8, MIN = 4;

function draw() {
  lcd.innerHTML = '<i></i>'.repeat(pin.length);
  lcd.classList.toggle('empty', !pin.length);
  go.disabled = busy || pin.length < MIN;
}
function say(t, err) { msg.textContent = t; msg.classList.toggle('err', !!err); }
function add(d) { if (busy || lockT || pin.length >= MAX) return; pin += d; say(''); draw(); }
function del() { if (busy || lockT) return; pin = pin.slice(0, -1); draw(); }

function startLock(sec) {
  const end = Date.now() + sec * 1000;
  clearInterval(lockT);
  const tick = () => {
    const left = Math.max(0, Math.round((end - Date.now()) / 1000));
    if (!left) { clearInterval(lockT); lockT = null; say(''); draw(); return; }
    say('Demasiados intentos. Prueba de nuevo en ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'), true);
  };
  lockT = setInterval(tick, 500); tick();
}

async function submit() {
  if (busy || lockT || pin.length < MIN) return;
  busy = true; draw();
  try {
    const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ pin }) });
    const d = await r.json().catch(() => ({}));
    if (r.ok) { say('Entrando…'); location.replace('/'); return; }
    pin = ''; lcd.classList.remove('bad'); void lcd.offsetWidth; lcd.classList.add('bad');
    if (r.status === 429 || d.wait) startLock(d.wait || 300);
    else say(d.error || 'No se pudo comprobar el PIN', true);
    if (r.status === 401 && d.left != null && !d.wait) say('PIN incorrecto. Te quedan ' + d.left + ' intentos.', true);
  } catch { say('No hay conexión con el PC.', true); }
  busy = false; draw();
}

document.getElementById('pad').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.d) add(b.dataset.d); else if (b.id === 'del') del(); else if (b.id === 'go') submit();
});
addEventListener('keydown', e => {
  if (/^[0-9]$/.test(e.key)) add(e.key);
  else if (e.key === 'Backspace') del();
  else if (e.key === 'Enter') submit();
});
draw();
</script>
</body>
</html>
